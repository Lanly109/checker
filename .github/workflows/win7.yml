name: Windows 7

on:
  push:
    branches: ["win7"]
  pull_request:
    branches: ["win7"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  VCPKGRS_TRIPLET: x86-windows-win7-static
  # Use the v142 linker selected below, rather than auto-detecting a newer one.
  CARGO_TARGET_I686_PC_WINDOWS_MSVC_LINKER: link.exe

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      # Keep native dependency versions aligned with Cargo.toml.
      - name: Check out pinned vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: d5ec528843d29e3a52d745a64b469f810b2cedbf
          path: target/vcpkg

      # Old vcpkg's private MSYS2 snapshot references packages removed from
      # the mirrors. Prepare a current host tool before selecting MSVC's PATH.
      - name: Prepare host pkg-config
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          release: false
          update: true
          install: mingw-w64-x86_64-pkgconf

      - name: Select Win7-compatible C++ tools
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
          toolset: "14.29"
          sdk: "10.0.19041.0"

      - name: Install Rust 1.77.2
        run: |
          rustup toolchain install 1.77.2 --profile minimal --target i686-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc +1.77.2 --version --verbose
          if (-not $env:VCToolsVersion.StartsWith("14.29.")) {
            throw "Expected MSVC v142 (14.29), got $env:VCToolsVersion"
          }

      - name: Build static SDL dependencies
        # The developer prompt exports Visual Studio's own VCPKG_ROOT.
        # Step-level env takes precedence over that exported value.
        env:
          VCPKG_ROOT: ${{ github.workspace }}\target\vcpkg
          PKG_CONFIG: ${{ steps.msys2.outputs.msys2-location }}\mingw64\bin\pkg-config.exe
        run: |
          Write-Host "Using pinned vcpkg at $env:VCPKG_ROOT"
          & "$env:PKG_CONFIG" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:VCPKG_ROOT\vcpkg.exe" install sdl2:x86-windows-win7-static sdl2-ttf:x86-windows-win7-static "--overlay-triplets=$env:GITHUB_WORKSPACE\ci\triplets"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build checker
        env:
          VCPKG_ROOT: ${{ github.workspace }}\target\vcpkg
        run: cargo +1.77.2 build --locked --release --target i686-pc-windows-msvc

      - name: Check Windows imports
        run: |
          python -m pip install pefile==2024.8.26
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ci/check_win7_imports.py target/i686-pc-windows-msvc/release/checker.exe

      - name: Prepare download
        run: |
          New-Item -ItemType Directory -Force -Path target/win7-package | Out-Null
          Copy-Item target/i686-pc-windows-msvc/release/checker.exe target/win7-package/
          Copy-Item WIN7.md target/win7-package/

      - name: Upload Win7 binary
        uses: actions/upload-artifact@v4
        with:
          name: checker-win7-x86
          path: target/win7-package/
          if-no-files-found: error
          retention-days: 30
